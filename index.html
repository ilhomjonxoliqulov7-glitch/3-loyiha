<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌤 Ob-havo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="weather-app">
    <header>
      <h1>🌤 Ob-havo</h1>
      <p class="subtitle">Istalgan shahar ob-havosini bilib oling</p>
    </header>

    <form class="search" id="searchForm">
      <input type="text" id="cityInput" placeholder="Shahar nomi (Tashkent, London...)" autocomplete="off">
      <button type="submit" class="search-btn">🔍</button>
    </form>

    <div id="output" class="output">
      <div class="welcome">
        <div class="welcome-icon">🌍</div>
        <p>Shahar nomini kiriting va qidiruv tugmasini bosing</p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
